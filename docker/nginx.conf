worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json image/svg+xml;

    # ── Nginx-level rate limits (defense-in-depth before Express) ──
    # Admin login endpoint: max 5 req/min per IP (burst 3)
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    # Admin API writes: max 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=admin_write:10m rate=30r/m;
    # General site traffic: max 120 req/min per IP
    limit_req_zone $binary_remote_addr zone=general:10m    rate=120r/m;
    # Return 429 on rate-limit, not 503
    limit_req_status 429;

    # ── HTTP server (no redirect; fallback when local cert is not trusted) ──
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options            "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header X-DNS-Prefetch-Control     "off"                             always;
        add_header Cross-Origin-Opener-Policy "same-origin"                     always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com https://unpkg.com; font-src 'self' https://fonts.cdnfonts.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self'; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self' https://mlnapp.raleigh.lib.wv.us;" always;

        # General rate limit on all traffic
        limit_req zone=general burst=30 nodelay;

        # Proxy /admin/* to the staff admin backend
        location /admin {
            proxy_pass         http://fcpl-admin:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_hide_header  X-Frame-Options;
            proxy_hide_header  X-Content-Type-Options;

            # Tighter rate limit on all admin API calls
            limit_req zone=admin_write burst=10 nodelay;
        }

        # Extra tight limit on login endpoint specifically
        location = /admin/api/auth/login {
            proxy_pass         http://fcpl-admin:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            limit_req zone=admin_login burst=3 nodelay;
        }

        # Proxy /api/* to the admin backend (for analytics & system endpoints)
        location /api {
            proxy_pass         http://fcpl-admin:3000/admin/api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ { expires 30d; }
        location ~* \.json$  { expires -1; }
        location ~* \.html$  { expires 1h; }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;
    }

    # ── HTTPS listener: immediately redirect to HTTP fallback ─────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        return 302 http://$host:8080$request_uri;
    }
}
