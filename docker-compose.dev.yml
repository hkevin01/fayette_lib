services:
  fcpl-admin:
    volumes:
      - ./site/data:/data
      - ./site/images:/images
      - ./admin/server.js:/app/server.js
      - ./admin/public:/app/public

  fcpl-admin-test:
    profiles: ["test"]
    build:
      context: ./admin
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
    command: npm test

