# Requirement ID: SPEC-INFRA-001
# Purpose: define two-service runtime topology for public site + admin backend.
# Rationale: deterministic deployment, consistent mount points, and recoverable operations.
# Inputs: repository sources, admin/.env, host-mounted site/data + site/images.
# Outputs: running containers with health checks and stable network paths.
# Preconditions: Docker permissions and required host ports are available.
# Postconditions: site and admin services are reachable and data volumes persist changes.
# Failure Modes: port collisions, permission-denied mounts, unhealthy containers.
# Error Handling: restart policies + healthcheck visibility for operator remediation.
# Verification: docker compose ps + manual smoke tests from docs/OPS_RUNBOOK.md.
services:
  fcpl-site:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fcpl-website
    ports:
      - "8080:80"    # HTTP  → primary access: http://localhost:8080
      - "8443:443"   # HTTPS → optional (requires cert): https://localhost:8443
    restart: unless-stopped
    depends_on:
      - fcpl-admin
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./site/data:/usr/share/nginx/html/data
      - ./site/images:/usr/share/nginx/html/images
      - ./site/simple:/usr/share/nginx/html/simple:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-data:/var/certbot
    healthcheck:
      test: ["CMD", "curl", "-fs", "--max-time", "3", "http://127.0.0.1/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  fcpl-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: fcpl-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    environment:
      - DATA_DIR=/data
      - IMAGES_DIR=/images/events
      - GENERAL_IMAGES_DIR=/images
    volumes:
      - ./site/data:/data
      - ./site/images:/images
    expose:
      - "3000"

  # ── Certbot: automatic Let's Encrypt renewal ──────────────────────────────
  # Runs continuously; renews when < 30 days remain (certs last 90 days);
  # touches /var/certbot/reload-trigger to signal nginx to hot-reload the cert.
  certbot:
    image: certbot/certbot:latest
    container_name: fcpl-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - certbot-data:/var/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet &&
        touch /var/certbot/reload-trigger;
        sleep 12h & wait $${!};
      done'
    restart: unless-stopped

volumes:
  letsencrypt:
  certbot-webroot:
  certbot-data:
